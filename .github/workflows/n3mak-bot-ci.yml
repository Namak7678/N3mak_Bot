name: N3mak Bot CI

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/n3mak-bot-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/n3mak-bot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3mak-bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bot/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
      - name: Validate JavaScript syntax
        run: |
          find src -type f -name "*.js" -print0 | xargs -0 -r -n1 node --check
