name: N3mak gateway checks

on:
  pull_request:
    paths:
      - "gateway-worker/**"
      - ".github/workflows/n3mak-gateway-checks.yml"
  push:
    branches:
      - main
      - "feat/n3mak-free-ai-router"
    paths:
      - "gateway-worker/**"
      - ".github/workflows/n3mak-gateway-checks.yml"

permissions:
  contents: read

jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run router tests
        run: node --test src/*.test.mjs
      - name: Check Worker syntax
        run: node --check src/worker.js
      - name: Build Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/n3mak-worker-dist
